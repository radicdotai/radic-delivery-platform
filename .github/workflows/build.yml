name: build

on:
  workflow_call:
    inputs:
      descriptor:
        type: string
        default: .radic/service.yml
      environment:
        type: string
        required: true
      wif_provider:
        type: string
        required: true
      service_account:
        type: string
        required: true
    outputs:
      digest:
        value: ${{ jobs.build.outputs.digest }}
      image_ref:
        value: ${{ jobs.build.outputs.image_ref }}

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      digest: ${{ steps.push.outputs.digest }}
      image_ref: ${{ steps.image.outputs.repo }}@${{ steps.push.outputs.digest }}
    steps:
      - uses: actions/checkout@v4  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          persist-credentials: false

      - name: Resolve this platform workflow's own commit
        id: platform
        run: |
          token=$(curl -sSf -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=radic-delivery-self" | jq -r .value)
          payload=$(cut -d. -f2 <<<"$token" | tr '_-' '/+')
          while (( ${#payload} % 4 )); do payload+="="; done
          sha=$(base64 -d <<<"$payload" | jq -r .job_workflow_sha)
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "no job_workflow_sha in OIDC token"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          repository: radicdotai/radic-delivery-platform
          ref: ${{ steps.platform.outputs.sha }}
          path: .platform
          persist-credentials: false

      - uses: astral-sh/setup-uv@v3  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          enable-cache: false

      - name: Validate descriptor
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          uv sync --project .platform/engine
          uv run --project .platform/engine radic-delivery descriptor validate "$DESCRIPTOR"

      - name: Image repository from descriptor
        id: image
        env:
          DESCRIPTOR: ${{ inputs.descriptor }}
        run: |
          repo=$(yq -r '.build.image.registry + "/" + .cloud_deploy.planes.dev + "/" + .build.image.repository + "/" + .build.image.name' "$DESCRIPTOR")
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "registry=$(yq -r .build.image.registry "$DESCRIPTOR")" >> "$GITHUB_OUTPUT"

      - id: auth
        uses: google-github-actions/auth@v2  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          workload_identity_provider: ${{ inputs.wif_provider }}
          service_account: ${{ inputs.service_account }}
          token_format: access_token

      - uses: docker/login-action@v3  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          registry: ${{ steps.image.outputs.registry }}
          username: oauth2accesstoken
          password: ${{ steps.auth.outputs.access_token }}

      - uses: docker/setup-buildx-action@v3  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention

      - id: push
        uses: docker/build-push-action@v6  # zizmor: ignore[unpinned-uses] tag pinning is this repo's convention
        with:
          context: .
          push: true
          provenance: false
          tags: ${{ steps.image.outputs.repo }}:${{ github.sha }}
