name: engine-ci

# This repository's OWN CI — distinct from the 12 reusable workflows this
# platform will ship for service repos to call. It gates changes to the
# engine, the schemas it validates against, and the policy ledger it reads.

on:
  pull_request:
    paths:
      - "engine/**"
      - "schemas/**"
      - "policy/**"
      - ".github/workflows/**"
      - "actions/**"
      - "templates/callers/**"
  push:
    branches: [dev]
    paths:
      - "engine/**"
      - "schemas/**"
      - "policy/**"
      - ".github/workflows/**"
      - "actions/**"
      - "templates/callers/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install security scanning tools
        # tests/unit/test_security_cli.py runs real gitleaks/hadolint/trivy
        # subprocess calls (not mocks) against the sample-repo fixtures —
        # this repo's own CI needs them on PATH for the same reason a
        # service repo's `security` job does (actions/setup-security-tools).
        uses: ./actions/setup-security-tools

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Run tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src/

      - name: Workflow lint
        uses: raven-actions/actionlint@v2

      - name: Workflow security scan (zizmor)
        # Scoped to specs/006's new files only, not the whole workflows/
        # actions/ templates tree — a full-tree run surfaces a substantial
        # pre-existing backlog in specs/001-004's already-merged artifacts
        # that this feature does not fix (research.md D6's documented scope
        # correction). --min-severity medium also keeps the pre-existing,
        # repo-wide "help"-tier self-repository style suggestion (already
        # present on every `./actions/...` reference since feature 002)
        # from being treated as a failure here.
        working-directory: ${{ github.workspace }}
        run: |
          uvx zizmor --min-severity medium \
            .github/workflows/release-commands.yml \
            actions/post-release-command-reply/action.yml \
            templates/callers/release.yml
