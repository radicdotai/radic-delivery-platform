schema_version: 1
service:
  name: web-bff
  kind: bff
  owner: platform-maintainers
repo:
  slug: radicdotai/web-bff
  trunk: dev
runtime:
  template: node
  version: "20"
build:
  dockerfile: Dockerfile
  image:
    registry: us-central1-docker.pkg.dev
    repository: radic-web-bff
    name: web-bff
environments:
  dev:
    gcp_project: radicai
    region: us-central1
    cloud_run_service: web-bff-dev
    health:
      url: https://web-bff-dev.example.run.app/health
      timeout_seconds: 60
      fail_on_timeout: true
    state:
      bucket: radicai-terraform-state-dev
      prefix: web-bff/dev
  stage:
    gcp_project: radicai
    region: us-central1
    cloud_run_service: web-bff-stage
    health:
      url: https://web-bff-stage.example.run.app/health
      timeout_seconds: 60
      fail_on_timeout: true
    state:
      bucket: radicai-terraform-state-main
      prefix: web-bff/stage
  prod:
    gcp_project: radicai-production
    region: us-central1
    cloud_run_service: web-bff
    health:
      url: https://web-bff.example.run.app/health
      timeout_seconds: 60
      fail_on_timeout: true
    state:
      bucket: radicai-terraform-state-main
      prefix: web-bff/prod
cloud_deploy:
  driver: cloud-deploy
  skaffold_file: deploy/skaffold.yaml
  planes:
    dev: radicai
    release: radicai-production
  deployables:
    - name: web-bff
      kind: service
      pipelines:
        dev: web-bff-dev
quality:
  lint:
    tool: eslint
  typecheck:
    tool: tsc
    blocking: true
  unit:
    runner: vitest
  coverage_floor:
    statements: 60
    branches: 60
    functions: 60
    lines: 60
  skip_budget: 0
  post_deploy:
    exception_id: EXC-9999  # does not exist in policy/exceptions.yml
    suites: []
release:
  tag_scheme: semver
  promotion:
    verify: ancestry+tree+tag
