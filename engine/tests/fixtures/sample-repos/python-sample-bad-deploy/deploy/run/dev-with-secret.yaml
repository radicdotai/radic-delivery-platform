apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: sample-dev
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "5"
    spec:
      serviceAccountName: sample-runtime@radicai.iam.gserviceaccount.com
      containerConcurrency: 80
      timeoutSeconds: 300
      containers:
        - image: app
          ports:
            - containerPort: 8080
          env:
            # Deliberately planted fake secret, seeded for the deploy
            # lint's no-inline-secret test (specs/004-deploy-yaml-lint).
            # This value is not real.
            - name: LOG_LEVEL
              value: "debug-AKIAABCDEFGHIJKLMNOP"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: sample-database-url
                  key: latest
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
