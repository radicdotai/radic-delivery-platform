[project]
name = "radic-delivery"
version = "0.1.0"
description = "Centralised CI/CD engine CLI for radic-delivery-platform"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12,<1.0",
  "jsonschema>=4.21,<5.0",
  "pyyaml>=6.0,<7.0",
]

[project.scripts]
radic-delivery = "radic_delivery.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/radic_delivery"]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.10,<2.0",
  "types-pyyaml>=6.0,<7.0",
  "types-jsonschema>=4.21,<5.0",
]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["tests/fixtures/sample-repos"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = [
  "B008",  # typer's Argument(...)/Option(...) in a default is the documented typer idiom
]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["radic_delivery"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
